[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xmsg"
dynamic = ["version"]
description = "Messages, roles and a request ledger across coding-agent CLIs from different labs (Claude Code, Codex, Antigravity, Grok, Muse)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Reed Kinning" }]
keywords = ["agents", "multi-agent", "claude-code", "codex", "llm", "coordination"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rk23/xmsg"
Repository = "https://github.com/rk23/xmsg"
Issues = "https://github.com/rk23/xmsg/issues"

[project.scripts]
xmsg = "xmsg.cli:main"

[tool.hatch.version]
path = "src/xmsg/cli.py"

[tool.hatch.build.targets.wheel]
packages = ["src/xmsg"]

[tool.hatch.build.targets.wheel.force-include]
"skills/xmsg" = "xmsg/skill"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
