<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="A builder and a reviewer: a Claude Code builder exchanges review requests and findings with a live Codex reviewer through xmsg, and test runs with a second Claude Code session through Claude Code's own SendMessage.">
<defs><marker id="xmsg" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" orient="auto-start-reverse" markerWidth="14" markerHeight="14"><path d="M0,0 L10,5 L0,10 z" fill="#d1d7e0"/></marker><marker id="native" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" orient="auto-start-reverse" markerWidth="11" markerHeight="11"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker></defs>
<rect width="1000" height="470" fill="#0d1117"/>
<rect x="20" y="16" width="960" height="384" rx="14" fill="#161b22" stroke="#30363d"/>
<text x="40" y="50" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">Your repo</text>
<line x1="392" y1="129" x2="608" y2="129" stroke="#d1d7e0" stroke-width="3.2" marker-start="url(#xmsg)" marker-end="url(#xmsg)"/>
<text x="500" y="117" fill="#9198a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="middle" stroke="#161b22" stroke-width="6" stroke-linejoin="round" paint-order="stroke">review request ↔ findings</text>
<line x1="225" y1="180" x2="225" y2="276" stroke="#7d8590" stroke-width="1.8" stroke-dasharray="7 5" marker-start="url(#native)" marker-end="url(#native)"/>
<text x="239" y="233" fill="#9198a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="start" stroke="#161b22" stroke-width="6" stroke-linejoin="round" paint-order="stroke">test runs ↔ results</text>
<rect x="60" y="80" width="330" height="98" rx="10" fill="#0d1117" stroke="#3d444d"/>
<rect x="60" y="92" width="4" height="74" rx="2" fill="#e8916d"/>
<text x="78" y="107" fill="#e8916d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="start" letter-spacing="0.5">BUILDER</text>
<text x="78" y="135" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">Claude Code</text>
<text x="78" y="160" fill="#9198a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="start">keeps xmsg watch --next running</text>
<rect x="610" y="80" width="330" height="98" rx="10" fill="#0d1117" stroke="#3d444d"/>
<rect x="610" y="92" width="4" height="74" rx="2" fill="#3fd1a4"/>
<text x="628" y="107" fill="#3fd1a4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="start" letter-spacing="0.5">REVIEWER</text>
<text x="628" y="135" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">Codex</text>
<text x="628" y="160" fill="#9198a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="start">live thread · codex queue</text>
<rect x="60" y="278" width="330" height="98" rx="10" fill="#0d1117" stroke="#3d444d"/>
<rect x="60" y="290" width="4" height="74" rx="2" fill="#e8916d"/>
<text x="78" y="305" fill="#e8916d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="start" letter-spacing="0.5">TESTER</text>
<text x="78" y="333" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">Claude Code</text>
<text x="78" y="358" fill="#9198a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="start">a second session</text>
<text x="775" y="330" fill="#9198a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="middle">owns its review's status:</text>
<text x="775" y="352" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="400" text-anchor="middle">accepted → running → done</text>
<line x1="40" y1="439" x2="82" y2="439" stroke="#d1d7e0" stroke-width="3.2" marker-end="url(#xmsg)"/>
<text x="96" y="444" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="start">xmsg message between harnesses</text>
<line x1="364.0" y1="439" x2="406.0" y2="439" stroke="#7d8590" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#native)"/>
<text x="420.0" y="444" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="start">native: Claude Code SendMessage</text>
</svg>
