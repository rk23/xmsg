<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="A review board: you approve the release; the owner sends one xmsg request that fans out to reviewers on three harnesses, a Codex thread, an agy conversation and a Grok conversation, and each replies with findings.">
